name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      validated-sha:
        description: Exact checkout SHA that passed every required validation job
        value: ${{ jobs.validated.outputs.sha }}

permissions:
  contents: read

# A new push to the same branch makes the running build irrelevant. Cancelling it frees
# a runner immediately, which matters more than the partial result it would have printed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── gates that need nothing but the source ────────────────────────────────────────
  discipline:
    name: Discipline checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No JDK, no Mill, no cache. Seconds, and it fails before a runner has been spent
    # compiling something that was never going to be merged.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false

      # Both greps below scan the examples as well as the library. `*/src/main/scala` expands
      # only to the seven top-level module directories — it never reaches
      # `examples/<name>/src/main/scala`, so for as long as that was the whole scope the
      # examples were exempt from the two rules the whole project is built around. They are
      # the code newcomers copy from, so they are the last place an exemption belongs.
      - name: No runtime reflection in main sources
        timeout-minutes: 5
        # native-image is reflect-config-free by construction; tui-macros derives at
        # compile time through Mirror instead.
        run: |
          if grep -rn "java\.lang\.reflect\|Class\.forName" --include="*.scala" */src/main/scala examples/*/src/main/scala examples/scala-cli 2>/dev/null; then
            echo "::error::runtime reflection found in main sources" >&2
            exit 1
          fi

      - name: All width arithmetic goes through CharWidth
        timeout-minutes: 5
        # Two exemptions, both for code that is not doing display-width arithmetic at all:
        # CharWidth itself (it is the one place allowed to cut a string), and the weather
        # example's hand-written JSON parser, which indexes ASCII bytes of a wire format.
        run: |
          violations=$(grep -rn "\.substring(" --include="*.scala" */src/main/scala examples/*/src/main/scala examples/scala-cli \
            | grep -v "core/CharWidth.scala" \
            | grep -v "examples/weather/src/main/scala/io/worxbend/tui/examples/weather/Json.scala" || true)
          if [ -n "$violations" ]; then
            echo "$violations" >&2
            echo "::error::String.substring outside core/CharWidth.scala" >&2
            exit 1
          fi

      - name: Every example is covered by CI
        timeout-minutes: 5
        run: python3 scripts/ci-examples.py discover

  workflow-checks:
    name: Workflow and release-tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Install workflow test dependencies
        timeout-minutes: 5
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt
      - name: Validate workflows
        timeout-minutes: 5
        run: bash scripts/check-workflows.sh
      - name: Release tooling regression tests
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/tests -v

  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - id: list
        timeout-minutes: 5
        # Derived, never hardcoded: adding examples/<name>/package.mill is the only step
        # needed to get that example compiled, tested, and built as a native binary.
        run: |
          names=$(python3 scripts/ci-examples.py discover)
          printf 'examples=%s\n' "$names" >> "$GITHUB_OUTPUT"
          echo "matrix: $names"

  lint:
    name: Formatting and lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Independent of compilation: scalafmt reads sources and the enabled scalafix rules
    # are syntactic, so neither waits for a build it does not need.
    #
    # The separate Autofix workflow can fix same-repository PRs. This read-only gate
    # always validates the checkout it received, including when Publish calls it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./.github/actions/mill
        timeout-minutes: 10
      - name: Formatting
        timeout-minutes: 20
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
      - name: Meta-build formatting
        timeout-minutes: 20
        # The scalafmt gate above walks __.sources, which never includes build.mill or the
        # package.mill files — the sources that define the build itself went unchecked.
        # The binary version is read from .scalafmt.conf so the two cannot drift apart.
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' .scalafmt.conf)
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -o "$RUNNER_TEMP/scalafmt-native" "https://github.com/scalameta/scalafmt/releases/download/v${v}/scalafmt-linux-glibc"
          chmod +x "$RUNNER_TEMP/scalafmt-native"
          mapfile -d '' -t packages < <(git ls-files -z '*package.mill')
          "$RUNNER_TEMP/scalafmt-native" --check build.mill "${packages[@]}"
      - name: Lints
        timeout-minutes: 20
        run: ./mill __.fix --check

  # ── build the library once, then reuse it ─────────────────────────────────────────
  build:
    name: Compile library
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./.github/actions/mill
        timeout-minutes: 10
        with:
          # The one job that writes the dependency cache, so the others never race to save it.
          dependency-cache: read-write

      - name: Compile every published module
        timeout-minutes: 30
        run: >-
          ./mill core.compile
          + terminal.compile
          + widgets.compile
          + runtime.compile
          + macros.compile
          + dsl.compile
          + test-support.compile
          + __.test.compile

      - name: Share the build output with the jobs below
        timeout-minutes: 5
        # Keyed by SHA, so it is scoped to this run. Mill's metadata embeds absolute
        # workspace paths, which is safe only because every runner in this workflow is
        # ubuntu and checks out to the same path.
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: out
          key: mill-build-${{ runner.os }}-${{ github.sha }}
          # Keyed by SHA only, so 'Re-run all jobs' on the same commit re-enters this step
          # with the key already present — save without this would fail the whole re-run.
          overwrite: true

  test:
    name: Test library (JDK ${{ matrix.jdk }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One JDK failing says nothing about the other, and the 26 leg is a "does next-JDK still work" signal
      # that should not block a PR on the LTS leg's account (or the reverse).
      fail-fast: false
      matrix:
        jdk: [25, 26] # 25: the -release floor and the one `build` compiled under. 26: latest, advisory.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      # `build` compiled under 25 (action.yml's default java-version, which is also what `.mill-jvm-version`
      # pins Mill's own process to). The 26 leg overrides that pin before the composite action below computes
      # its cache keys, so both the dependency cache and the choice to skip restoring `build`'s `out/` follow
      # from the same file: a restore under a mismatched JDK would let Mill see the 25-compiled classes as
      # up-to-date and skip compiling under 26 entirely, silently testing nothing new.
      #
      # `zulu:26`, not `temurin:26`: Mill resolves JDKs against its own pinned coursier JVM index, and as of
      # this writing that index has no JDK 26 entry for Temurin at all (`coursier.jvm.JvmCache$JvmNotFoundInIndex:
      # No temurin version matching '26' found` — verified locally). Zulu 26 is in the index and this repo's
      # library sources compile and test clean under it; revisit once Mill's pinned index catches up.
      - name: Compile under JDK 26 instead of the pinned .mill-jvm-version
        timeout-minutes: 5
        if: matrix.jdk == 26
        run: echo "zulu:26" > .mill-jvm-version
      - uses: ./.github/actions/mill
        timeout-minutes: 10
        with:
          build-output: ${{ matrix.jdk == 25 && 'restore' || 'skip' }}
      # One step per module: a single combined step reports only "still running", so a module that hangs cannot be
      # told from a slow one. Per-module steps name the culprit in the live job view, and each carries its own timeout
      # so a hang fails in minutes instead of occupying a runner until the six-hour job limit.
      - name: Test core
        timeout-minutes: 10
        run: ./mill core.test
      - name: Test terminal
        timeout-minutes: 10
        run: ./mill terminal.test
      - name: Test widgets
        timeout-minutes: 10
        run: ./mill widgets.test
      - name: Test runtime
        timeout-minutes: 10
        run: ./mill runtime.test
      - name: Test macros
        timeout-minutes: 10
        run: ./mill macros.test
      - name: Test dsl
        timeout-minutes: 10
        run: ./mill dsl.test
      - name: Test test-support
        timeout-minutes: 10
        run: ./mill test-support.test

  # ── examples: one small job each, all reusing the compiled library ────────────────
  example:
    name: Example ${{ matrix.example }}
    needs: [build, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One example failing says nothing about the other nine, and finding out about all
      # of them in one run beats nine more pushes.
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./.github/actions/mill
        timeout-minutes: 10
        with:
          build-output: restore
      - name: Compile and test
        timeout-minutes: 20
        env:
          EXAMPLE: ${{ matrix.example }}
        run: python3 scripts/ci-examples.py test --example "$EXAMPLE"
      # The screenshots the docs show are rendered from the gallery's pages, so a change that moves a pixel of one
      # has to commit the new picture with it: regenerate them and fail on any difference.
      - name: Gallery screenshots match the code
        if: matrix.example == 'gallery'
        timeout-minutes: 10
        run: bash scripts/render-gallery.sh --check

  native-image:
    name: Native images
    needs: [build, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deliberately one job rather than a matrix. Each image needs the GraalVM toolchain,
    # which Mill fetches through coursier; a matrix would download it on every shard the
    # first time, and the builds themselves are ~30s each. One job keeps that download
    # to once; all discovered task selectors are separated by Mill's `+`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./.github/actions/mill
        timeout-minutes: 10
        with:
          build-output: restore

      - name: Build a native image for every example
        timeout-minutes: 45
        run: python3 scripts/ci-examples.py build-native

      - name: Every binary detects the missing TTY and exits cleanly
        # Each child has its own ten-second bound and no controlling TTY; timeouts
        # kill the process group, then the remaining examples are still checked.
        timeout-minutes: 3
        run: python3 scripts/ci-examples.py smoke-native

  # ── the guide itself ──────────────────────────────────────────────────────────────
  website-build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # docusaurus.config.js sets onBrokenLinks/onBrokenAnchors to 'throw', so a dead
    # cross-reference fails the build — but only if something builds the site before
    # merge. The docs workflow builds it on main; this gate builds it on the PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 5
        with:
          node-version: "24"
          cache: npm
          # The lockfile lives under website/, not at the repository root, so the
          # default cache lookup would find nothing to key on.
          cache-dependency-path: website/package-lock.json
      - name: Build Docusaurus site
        timeout-minutes: 15
        working-directory: website
        run: |
          npm ci
          npm test
          # Remaining upstream advisories are tracked in website/DEPENDENCY_SECURITY.md.
          npm audit --audit-level=critical
          npm run build

  packaged-consumer:
    name: Verify published POMs and isolated consumer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./.github/actions/mill
        timeout-minutes: 10
        with:
          build-output: restore
      - name: Resolve and exercise the actual packaged artifacts
        timeout-minutes: 30
        run: python3 scripts/verify-packaged-consumer.py

  # An output exists only when every gate above succeeded for this exact checkout.
  # Publish consumes this SHA, not a branch name or an unrelated successful CI run.
  validated:
    name: Record validated commit
    needs: [discipline, workflow-checks, discover, lint, build, test, example, native-image, website-build, packaged-consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - id: commit
        timeout-minutes: 5
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"
