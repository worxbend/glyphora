# Publishes all tui-* modules to Maven Central (Sonatype) when a version tag is pushed.
#
# Required repository secrets:
#   MILL_SONATYPE_USERNAME / MILL_SONATYPE_PASSWORD — a Central Portal token pair
#   MILL_PGP_SECRET_BASE64 — base64-encoded ASCII-armored PGP secret key
#   MILL_PGP_PASSPHRASE    — its passphrase (omit if the key has none)
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # This reuses the full CI graph on the tag's exact commit, without exposing signing
  # credentials. A successful main-branch run on some other SHA is not sufficient.
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.validated-sha }}
          persist-credentials: false
      - name: Checkout is the validated tag commit
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ -z "$VALIDATED_SHA" ] || [ "$actual" != "$VALIDATED_SHA" ] || [ "$actual" != "$GITHUB_SHA" ]; then
            echo "::error::refusing to publish a commit other than the validated tag SHA" >&2
            exit 1
          fi
      - uses: ./.github/actions/mill

      # Publishing needs four repository secrets. Without them `SonatypeCentralPublishModule`
      # still compiles every module and generates every Scaladoc first — about a minute — and
      # only then dies inside Mill's PGP import with a stack trace that does not name what is
      # actually missing. Checking here turns that into an immediate, readable failure.
      #
      # `MILL_PGP_PASSPHRASE` is deliberately not required: a signing key with no passphrase is
      # a legitimate setup, and Mill treats the empty value as "no passphrase".
      - name: Publishing credentials are present
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
        run: |
          missing=""
          [ -n "$MILL_SONATYPE_USERNAME" ] || missing="$missing MILL_SONATYPE_USERNAME"
          [ -n "$MILL_SONATYPE_PASSWORD" ] || missing="$missing MILL_SONATYPE_PASSWORD"
          [ -n "$MILL_PGP_SECRET_BASE64" ] || missing="$missing MILL_PGP_SECRET_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::cannot publish — these repository secrets are unset:$missing. Set them under Settings -> Secrets and variables -> Actions. MILL_SONATYPE_* is a Central Portal token pair from central.sonatype.com; MILL_PGP_SECRET_BASE64 is an ASCII-armored PGP secret key piped through base64. The tag stays valid: re-run this workflow once the secrets exist." >&2
            exit 1
          fi

      # The tag decides nothing about what gets published — `SonatypeCentralPublishModule`
      # uploads whatever `TuiPublishModule.publishVersion` in build.mill says. So a `v0.13.0`
      # tag pushed while build.mill still reads "0.12.0" would quietly publish 0.12.0 a second
      # time, and Maven Central coordinates are immutable: there is no way to take that back.
      # Comparing the two here turns a permanent mistake into a red job you fix with one commit.
      - name: Tag matches the version in build.mill
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(./mill show core.publishVersion | tr -d '"')
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $GITHUB_REF_NAME wants version '$expected' but TuiPublishModule.publishVersion in build.mill is '$actual' — bump build.mill and re-tag" >&2
            exit 1
          fi
          echo "publishing version $actual"

      - name: Publish to Maven Central
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: ./mill mill.scalalib.SonatypeCentralPublishModule/
