name: Autofix

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix (same-repo PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Formatting is not a thing to fail a review over when a machine can just do it. This
    # applies scalafmt and any auto-fixable scalafix rule and pushes the result back to
    # the branch.
    #
    # Skipped for forks on purpose: a fork's token is read-only, so the push would fail
    # and the run would go red for something the contributor cannot act on. Those PRs are
    # covered by the `lint` gate instead.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          ref: ${{ github.head_ref }}
          # Token-generated PR synchronization runs require maintainer approval;
          # approve full CI on the resulting SHA before merging (see versioning docs).
          persist-credentials: false
      - uses: ./.github/actions/mill
        timeout-minutes: 10

      - name: Apply scalafmt and scalafix
        timeout-minutes: 45
        run: |
          ./mill mill.scalalib.scalafmt.ScalafmtModule/reformatAll __.sources
          ./mill __.fix
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' .scalafmt.conf)
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -o "$RUNNER_TEMP/scalafmt-native" "https://github.com/scalameta/scalafmt/releases/download/v${v}/scalafmt-linux-glibc"
          chmod +x "$RUNNER_TEMP/scalafmt-native"
          mapfile -d '' -t packages < <(git ls-files -z '*package.mill')
          "$RUNNER_TEMP/scalafmt-native" build.mill "${packages[@]}"

      - name: Test the fixed tree
        timeout-minutes: 45
        # Exercise the fixed sources before pushing. This is not full CI: maintainers
        # must approve the token-generated CI run on the resulting commit before merge.
        run: ./mill __.test

      - name: Commit anything that changed
        timeout-minutes: 5
        env:
          GLYPHORA_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_ASKPASS: ${{ github.workspace }}/scripts/git-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if git diff --quiet; then
            echo "already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply scalafmt and scalafix"
          git push
          echo "::notice::pushed a formatting commit — pull it locally and approve the full CI run for its SHA before merging"
